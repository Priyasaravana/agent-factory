# Everything runs in containers. Nothing but Docker is needed on the host, and
# the factory never gets the host's Docker socket.
name: agent-factory

services:
  dind:
    image: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    restart: unless-stopped              # come back after Docker Desktop restarts / laptop sleep
    privileged: true                     # required by Docker-in-Docker; scoped to this container
    # Containers inside dind (builds, start checks, scanners, kind nodes and app pods) can't open
    # connections to this compose network, where the engine, auth and the gateway live (S-02).
    entrypoint: ["/usr/local/bin/dind-firewall.sh"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DIND_COMPOSE_ALLOW_PORTS: ${DIND_COMPOSE_ALLOW_PORTS:-4000}   # the model gateway (sandbox egress route)
    networks:
      default:
        # dind's generated TLS server cert is valid for "docker" (not the service name),
        # so the factory must connect as tcp://docker:2376 or TLS verification fails.
        aliases: [docker]
    volumes:
      - ./cluster/dind-firewall.sh:/usr/local/bin/dind-firewall.sh:ro
      - dind-certs:/certs
      - dind-data:/var/lib/docker        # images + kind cluster survive restarts
      # Same host folder at the same path as in the factory, so agent sandboxes
      # (containers inside dind) can mount a run's worktree — and only that.
      - ./.factory-data:/data
    ports:
      - "127.0.0.1:8081-8100:8081-8100"  # generated apps (kind NodePorts 30080-30099)
      - "127.0.0.1:8180:8180"            # generated apps behind the local ingress (ADR-0026)
    healthcheck:
      # healthy only with both firewall rules really in place and their watcher running (it reads the
      # rules, not a marker): the factory never starts on a dind without them
      test: ["CMD-SHELL", "docker info >/dev/null && /usr/local/bin/dind-firewall.sh check"]
      interval: 5s
      retries: 30

  # One-shot root step (ADR-0018): hands dind's client certs and /data to uid 10001,
  # then exits. No network, only the three capabilities it needs.
  factory-init:
    build:
      context: .
      dockerfile: images/factory/Dockerfile
    user: "0:0"
    entrypoint: ["/opt/factory/cluster/init.sh"]
    command: []
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - dind-certs:/certs:ro
      - factory-certs:/factory-certs
      - ./.factory-data:/data
      - gateway-proof-engine:/gateway-proof/engine   # the gateway proof (S-01): the engine's copy
      - gateway-proof-web:/gateway-proof/web         # and nginx's, as a config line
    depends_on:
      dind:
        condition: service_healthy     # dind has generated its TLS certs
    restart: "no"

  factory:
    build:
      context: .
      dockerfile: images/factory/Dockerfile
      # ADR-0051: core (Apache-2.0) unless FACTORY_EDITION=enterprise; the licence key is the mounted
      # secret file .secrets/agent_factory_licence (AGENT_FACTORY_LICENCE_FILE's default)
      target: ${FACTORY_EDITION:-core}
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker:2376     # must match the dind cert SAN (see alias above)
      AGENT_FACTORY_EVIDENCE_SIGNER: ${AGENT_FACTORY_EVIDENCE_SIGNER:-local}  # ADR-0051: a named signer fails closed
      DOCKER_TLS_VERIFY: "1"
      DIND_HOST: dind
      AUTH_MODE: gateway                 # trust only the identity the gateway forwards
      # ...and only with the gateway's proof: identity headers from any other caller on the
      # network are refused (S-01). Made by factory-init; the engine won't start without it.
      GATEWAY_PROOF_FILE: /run/gateway-proof/secret
      # agents + generated code run in throw-away sandboxes inside dind (ADR-0014);
      # AGENT_SANDBOX=off in .env is for development only
      AGENT_SANDBOX: ${AGENT_SANDBOX:-container}
      # this install's own settings over the image's config.yaml (phase B); read at start, absent is fine
      FACTORY_CONFIG_LOCAL: /etc/agent-factory/config.local.yaml
    # Least privilege (ADR-0018): never root, no capabilities, no privilege escalation.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - factory-certs:/factory-certs:ro  # dind client certs, owned by uid 10001 (factory-init)
      - gateway-proof-engine:/run/gateway-proof:ro
      - ./.factory-data:/data            # state, product repos, run worktrees
      # read-only: the gitignored config.local.yaml, never in the image (.dockerignore). A folder, not the
      # file, so an install without one starts cleanly (docker would make a missing file a directory)
      - ./.agent-factory:/etc/agent-factory:ro
      # S-06: tokens as files (`NAME_FILE=/run/secrets/…` in .env, read by env://NAME when a step needs it), so the
      # values aren't in the engine's environment; `make secrets-files` moves them out of .env once
      - ./.secrets:/run/secrets:ro
    depends_on:
      dind:
        condition: service_healthy
      factory-init:
        condition: service_completed_successfully
    # No published port: every API call goes through the web gateway (8080), which
    # asks the auth service first. API docs: http://localhost:8080/api/docs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60                        # live mode: first start creates the kind cluster
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: images/auth/Dockerfile
      target: ${FACTORY_EDITION:-core}   # ADR-0051/0052: enterprise adds licensed single sign-on
    environment:
      # Only what auth needs; it never gets the factory's .env (model/GitHub tokens).
      FACTORY_ADMIN_USER: ${FACTORY_ADMIN_USER:-admin}
      FACTORY_ADMIN_PASSWORD: ${FACTORY_ADMIN_PASSWORD:-}   # first start only; else a one-time password is generated
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_IDLE_MINUTES: ${AUTH_IDLE_MINUTES:-60}          # a session unused this long ends (S-14)
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}      # true behind HTTPS
      # single sign-on (ADR-0052, enterprise edition with a licence covering `sso`); unset: local sign-in only.
      # The licence key and client secret are files in .secrets/ (mounted below), never values here.
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}                # e.g. https://factory.example.com
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_LABEL: ${AUTH_OIDC_LABEL:-}
      AUTH_OIDC_ADMIN_GROUPS: ${AUTH_OIDC_ADMIN_GROUPS:-}
      AUTH_OIDC_MEMBER_GROUPS: ${AUTH_OIDC_MEMBER_GROUPS:-}
      AUTH_OIDC_ALLOWED_DOMAINS: ${AUTH_OIDC_ALLOWED_DOMAINS:-}
    cap_drop: [ALL]                      # runs as uid 10002 (image USER), needs no capabilities
    security_opt: ["no-new-privileges:true"]
    volumes:
      - auth-data:/data                  # its own database: users, sessions, token hashes, audit
      # its own secrets folder, never the factory's tokens: agent_factory_licence and auth_oidc_client_secret
      # (enterprise edition, ADR-0052); an empty folder on core
      - ./.secrets/auth:/run/secrets:ro
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      factory:
        condition: service_started     # nginx no longer needs the engine up to serve the UI
      auth:
        condition: service_started
      factory-init:
        condition: service_completed_successfully   # the gateway proof exists before nginx reads it
    volumes:
      - gateway-proof-web:/etc/nginx/gateway-proof:ro   # nginx.conf includes it; nginx won't start without
    ports:
      - "127.0.0.1:8080:8080"            # the factory UI (unprivileged nginx listens on 8080)
    cap_drop: [ALL]                      # nginx runs as uid 101, needs no capabilities
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Model gateway (ADR-0036), off by default: set COMPOSE_PROFILES=gateway in .env and
  # `model_gateway.provider: litellm` in the config. Agents then reach the model only
  # through it, with a virtual key per agent call; it never gets the factory's .env.
  model-gateway:
    profiles: [gateway]
    # By digest, and only by digest (S-07): an install may choose another repository or tag (LITELLM_REPO) and
    # digest (LITELLM_DIGEST), but the reference always ends in `@`, so a tag alone is not a valid image here.
    # `scripts/pin-images.py --check-compose` (make up / upgrade, CI) also refuses anything but @sha256:<64 hex>.
    image: ${LITELLM_REPO:-ghcr.io/berriai/litellm-non_root:main-stable}@${LITELLM_DIGEST:-sha256:c626bac46847bc539118c252a63c430728088e1cd0707ca39ff4ed5f7868057a}
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}               # required with the gateway profile
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}             # api_key mode only; empty in subscription mode
      DATABASE_URL: postgresql://litellm:${MODEL_GATEWAY_DB_PASSWORD:-}@model-gateway-db:5432/litellm
    volumes:
      - ./images/model-gateway/config.yaml:/etc/litellm/config.yaml:ro
    depends_on:
      model-gateway-db:
        condition: service_healthy
    # no published port: only the engine and the sandboxes' egress proxy reach it
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  model-gateway-db:
    profiles: [gateway]
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    user: "70:70"                        # the image's postgres user; the volume inherits its ownership
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${MODEL_GATEWAY_DB_PASSWORD:-}   # required with the gateway profile
    volumes:
      - model-gateway-db:/var/lib/postgresql/data   # keys, budgets, spend; the factory stays on SQLite
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 5s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  dind-certs:
  factory-certs:                         # dind client certs for uid 10001 (written by factory-init)
  gateway-proof-engine:                  # the gateway proof (S-01), readable only by uid 10001
  gateway-proof-web:                     # the same secret as an nginx config line, readable only by uid 101
  dind-data:
  auth-data:
  model-gateway-db:
