# Everything runs in containers. Nothing but Docker is needed on the host, and
# the factory never gets the host's Docker socket.
name: agent-factory

services:
  dind:
    image: docker:27-dind
    restart: unless-stopped              # come back after Docker Desktop restarts / laptop sleep
    privileged: true                     # required by Docker-in-Docker; scoped to this container
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      default:
        # dind's generated TLS server cert is valid for "docker" (not the service name),
        # so the factory must connect as tcp://docker:2376 or TLS verification fails.
        aliases: [docker]
    volumes:
      - dind-certs:/certs
      - dind-data:/var/lib/docker        # images + kind cluster survive restarts
      # Same host folder at the same path as in the factory, so agent sandboxes
      # (containers inside dind) can mount a run's worktree — and only that.
      - ./.factory-data:/data
    ports:
      - "127.0.0.1:8081-8100:8081-8100"  # generated apps (kind NodePorts 30080-30099)
      - "127.0.0.1:8180:8180"            # generated apps behind the local ingress (ADR-0026)
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      retries: 30

  # One-shot root step (ADR-0018): hands dind's client certs and /data to uid 10001,
  # then exits. No network, only the three capabilities it needs.
  factory-init:
    build:
      context: .
      dockerfile: images/factory/Dockerfile
    user: "0:0"
    entrypoint: ["/opt/factory/cluster/init.sh"]
    command: []
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - dind-certs:/certs:ro
      - factory-certs:/factory-certs
      - ./.factory-data:/data
    depends_on:
      dind:
        condition: service_healthy     # dind has generated its TLS certs
    restart: "no"

  factory:
    build:
      context: .
      dockerfile: images/factory/Dockerfile
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker:2376     # must match the dind cert SAN (see alias above)
      DOCKER_TLS_VERIFY: "1"
      DIND_HOST: dind
      AUTH_MODE: gateway                 # trust only the identity the gateway forwards
      # agents + generated code run in throw-away sandboxes inside dind (ADR-0014);
      # AGENT_SANDBOX=off in .env is for development only
      AGENT_SANDBOX: ${AGENT_SANDBOX:-container}
    # Least privilege (ADR-0018): never root, no capabilities, no privilege escalation.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - factory-certs:/factory-certs:ro  # dind client certs, owned by uid 10001 (factory-init)
      - ./.factory-data:/data            # the ONLY host path mounted: state, product repos, run worktrees
    depends_on:
      dind:
        condition: service_healthy
      factory-init:
        condition: service_completed_successfully
    # No published port: every API call goes through the web gateway (8080), which
    # asks the auth service first. API docs: http://localhost:8080/api/docs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60                        # live mode: first start creates the kind cluster
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: images/auth/Dockerfile
    environment:
      # Only what auth needs; it never gets the factory's .env (model/GitHub tokens).
      FACTORY_ADMIN_USER: ${FACTORY_ADMIN_USER:-admin}
      FACTORY_ADMIN_PASSWORD: ${FACTORY_ADMIN_PASSWORD:-}   # first start only; else a one-time password is generated
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}      # true behind HTTPS
    cap_drop: [ALL]                      # runs as uid 10002 (image USER), needs no capabilities
    security_opt: ["no-new-privileges:true"]
    volumes:
      - auth-data:/data                  # its own database: users, sessions, token hashes, audit
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      factory:
        condition: service_started     # nginx no longer needs the engine up to serve the UI
      auth:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"            # the factory UI (unprivileged nginx listens on 8080)
    cap_drop: [ALL]                      # nginx runs as uid 101, needs no capabilities
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  dind-certs:
  factory-certs:                         # dind client certs for uid 10001 (written by factory-init)
  dind-data:
  auth-data:
