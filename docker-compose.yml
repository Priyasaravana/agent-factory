# Everything runs in containers. Nothing but Docker is needed on the host, and
# the factory never gets the host's Docker socket.
name: agent-factory

services:
  dind:
    image: docker:27-dind
    restart: unless-stopped              # come back after Docker Desktop restarts / laptop sleep
    privileged: true                     # required by Docker-in-Docker; scoped to this container
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      default:
        # dind's generated TLS server cert is valid for "docker" (not the service name),
        # so the factory must connect as tcp://docker:2376 or TLS verification fails.
        aliases: [docker]
    volumes:
      - dind-certs:/certs
      - dind-data:/var/lib/docker        # images + kind cluster survive restarts
    ports:
      - "127.0.0.1:8081-8085:8081-8085"  # generated apps (kind NodePorts)
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      retries: 30

  factory:
    build:
      context: .
      dockerfile: images/factory/Dockerfile
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker:2376     # must match the dind cert SAN (see alias above)
      DOCKER_TLS_VERIFY: "1"
      DIND_HOST: dind
    volumes:
      - dind-certs:/certs:ro
      - ./.factory-data:/data            # the ONLY host path mounted: state, product repos, run worktrees
    depends_on:
      dind:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"            # API + OpenAPI docs at /api/docs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60                        # live mode: first start creates the kind cluster
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      factory:
        condition: service_started     # nginx no longer needs the engine up to serve the UI
    ports:
      - "127.0.0.1:8080:80"              # the factory UI
    restart: unless-stopped

volumes:
  dind-certs:
  dind-data:
