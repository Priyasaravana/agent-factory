{{- if .Values.postgres.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "app.dbSecret" .) }}
{{- $password := randAlphaNum 24 }}
{{- if $existing }}{{- $password = index $existing.data "password" | b64dec }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.dbSecret" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user $password (include "app.name" .) .Values.postgres.database | quote }}
{{- end }}
