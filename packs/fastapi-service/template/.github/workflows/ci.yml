# Generated by Agent Factory (golden path: fastapi-service). The same checks the
# factory's Verify and Readiness stations run, so a human PR meets the same bar.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: lint, tests with coverage, bandit
        run: make verify
      - name: secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --no-banner
      - name: container image builds
        run: docker build -t app:ci .
