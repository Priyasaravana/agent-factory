# Stack pack #1 (ADR-0041): the FastAPI service the factory has built since ADR-0001, extracted
# unchanged. A pack says WHAT to build; the blueprint in the config that names it (`pack:`) says
# where and how this install runs it (environment, ports, scan commands, minimum level).
# Only an admin installs a pack, after reviewing it: list its folder under `packs:` in the config.
id: fastapi-service
version: 1.2.1
title: FastAPI service
stack:
  builds: service
  summary: Python FastAPI REST service with Postgres, a Helm chart and one container on Kubernetes
  # what this pack builds with; intake asks before building a request that needs anything else
  technologies: [python, fastapi, postgres, sqlalchemy, docker, helm, kubernetes]
  template: template                  # copied into a new product's repo
  skill: skills/fastapi-golden-path   # preloaded for the design, implement and deploy-repair agents
  toolchain: [python@3.12, uv]        # what the sandbox image provides today
  verify: make verify
  e2e: E2E_BASE_URL={url} uv run pytest tests/e2e
  port: 8000
  health: {live: /healthz, ready: /readyz}
  chart: deploy/chart
  # how a new version reaches users (ADR-0046 slice 4): the strategies the chart supports, and
  # what a product uses unless it chooses another. blue-green runs two colours on one database, so
  # a schema change must also work with the version still running
  deploy: {strategy: in-place, strategies: [in-place, blue-green]}
  # run and maintain (roadmap J4): what "available" means for this stack's products (a product may
  # tighten it), where the request counter is read, how the data is backed up, restored and
  # fingerprinted (a row count per table, compared after a restore drill), and how dependencies are
  # checked for newer releases. Data commands run inside the release's Postgres pod, never in the engine
  operate:
    availability: {success: 0.99, window_minutes: 30, min_samples: 5, max_error_rate: 0.05}
    metrics: {path: /metrics, counter: http_requests_total, status_label: status}
    data:
      workload: "statefulset/{release}-postgres"
      database: app
      backup: pg_dump -U app -d {database} --format=custom --no-owner
      restore: pg_restore -U app -d {database} --clean --if-exists --no-owner --exit-on-error
      fingerprint: >-
        psql -U app -d {database} -At -c "select table_name || '=' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE' order by 1"
      scratch_create: createdb -U app {database}
      scratch_drop: dropdb -U app --if-exists {database}
    upkeep: {outdated: "uv sync --quiet && uv pip list --outdated --format json", format: pip}
  detect: {files: [pyproject.toml], deps: [fastapi]}
  readiness: readiness.yaml           # how this stack proves the stack-specific signals
