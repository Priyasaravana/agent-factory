# Stack pack #2 (ADR-0041): a server-rendered Next.js web app. A pack says WHAT to build; the
# blueprint in the config that names it (`pack:`) says where and how this install runs it.
# Only an admin installs a pack, after reviewing it: list its folder under `packs:` in the config.
id: nextjs-web
version: 1.3.2
title: Next.js web app
stack:
  builds: web-app
  summary: Next.js (App Router) + TypeScript web app with Postgres, server-rendered, one container on Kubernetes
  # what this pack builds with; intake asks before building a request that needs anything else
  technologies: [typescript, next.js, react, node.js, postgres, docker, helm, kubernetes]
  template: template                 # copied into a new product's repo
  skill: skills/nextjs-golden-path   # preloaded for the design, implement and deploy-repair agents
  # what the sandbox image must provide (preflight refuses the pack otherwise); chromium asks the
  # engine to build the sandbox's browser layer, for the Playwright version the template pins
  toolchain: [node@22, npm, chromium]
  verify: make verify
  e2e: make e2e BASE_URL={url}       # after every deploy: smoke tests + axe on every route (a11y)
  # e2e before deploy (ADR-0043 §5): the factory starts this in the sandbox (standalone server on an
  # in-memory database), waits for the liveness path and runs `e2e` against it before any image
  preview: {command: make preview, url: "http://127.0.0.1:3000"}
  port: 3000
  health: {live: /api/healthz, ready: /api/readyz}
  chart: deploy/chart
  # npm is already on the shared allowlist (registry.npmjs.org), and the browser is in the image,
  # so this pack's sandboxes need no egress of their own
  egress: []
  detect: {files: [package.json], deps: [next]}
  readiness: readiness.yaml          # how this stack proves the stack-specific signals, plus a11y
  evals: evals.yaml                  # this pack's evaluation cases (per-pack gating: ADR-0041 step 5)
  decisions: decisions.yaml          # the design questions every product answers (ADR-0044 §1)
  # approved runtime images, default first (ADR-0045): stages of the template's Dockerfile. When the
  # default holds on base-image CVEs its publisher hasn't shipped a fix for, Build tries the next one
  # (scan + a start-up check) and records which it used. `login` names a `registry_logins` entry.
  base_images:
    - {stage: runtime-hardened, image: "dhi.io/node:22-alpine3.23", login: dhi, title: Docker Hardened Node 22}
    - {stage: runtime-distroless, image: "gcr.io/distroless/nodejs22-debian12:nonroot", title: Distroless Node 22}
  # the deployment's first admin (ADR-0044 §3): the chart generates it into this Secret; the factory
  # reads it after deploy to sign the live e2e suite and the hidden scenarios in, redacted
  admin_secret:
    name: "{release}-admin"
    email: email
    password: password
    sign_in: >-
      Sign in with `curl -c jar -H 'content-type: application/json' -d
      "{\"email\":\"$E2E_ADMIN_EMAIL\",\"password\":\"$E2E_ADMIN_PASSWORD\"}" <url>/api/auth/sign-in`
      (200 and a session cookie), then send `-b jar` on later calls. A browser form posts to the
      same route; cross-site posts are refused, so send no Origin header.
