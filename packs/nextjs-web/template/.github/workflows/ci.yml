# Generated by Agent Factory (stack pack: nextjs-web). The same checks the factory's Verify and
# Readiness stations run, so a human PR meets the same bar.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: lint, types, tests with coverage, audit, build
        run: make verify
      - name: secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --no-banner
      - name: container image builds
        # the distroless runtime needs no registry sign-in; the factory builds the hardened one
        # (dhi.io) with its own Docker Hub token (ADR-0045)
        run: docker build --build-arg RUNTIME=runtime-distroless -t app:ci .
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps --only-shell chromium
      - name: end-to-end and accessibility tests against the built app
        run: |
          npx next build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 node server.js &) && sleep 3
          make e2e BASE_URL=http://localhost:3000
