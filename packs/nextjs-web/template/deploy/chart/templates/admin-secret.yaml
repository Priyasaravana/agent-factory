{{- /* The first account (ADR-0044 §3): the app creates this admin on first start when it has no
users yet (with local accounts; an app without sign-in ignores it). The password is random and
kept across upgrades; it is never in the values, the repo or the factory's logs. The factory reads
it from this Secret to sign its live e2e tests and hidden scenarios in. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "app.adminSecret" .) }}
{{- $password := randAlphaNum 24 }}
{{- if $existing }}{{- $password = index $existing.data "password" | b64dec }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.adminSecret" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.admin.email | quote }}
  password: {{ $password | quote }}
