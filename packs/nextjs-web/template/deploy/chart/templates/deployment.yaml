apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532}   # distroless `nonroot`
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.containerPort }}}]
          env:
            - {name: PORT, value: {{ .Values.containerPort | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ include "app.name" . | quote }}}
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "app.dbSecret" . }}, key: database-url}}
            {{- end }}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: {{ include "app.adminSecret" . }}, key: email}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "app.adminSecret" . }}, key: password}}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/readyz, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /api/healthz, port: http}
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /app/.next/cache}   # Next writes its render cache here
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
