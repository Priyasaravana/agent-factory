# image.*, service.* and ingress.* are set by the factory's Deploy station:
# the local target uses a NodePort; a cluster target (helm provider) uses ClusterIP + an ingress host.
image:
  repository: app
  tag: dev
  pullPolicy: IfNotPresent     # tags are commit SHAs: an image never changes under a tag

imagePullSecrets: []           # e.g. [{name: factory-pull}] for a private registry

# how a new version reaches users (ADR-0046 slice 4), set per product by the factory:
#   in-place    one Deployment, updated rolling; it runs `image`
#   blue-green  blue and green Deployments on this release's one database; the Service sends users
#               to blueGreen.live, and previewHost reaches the other colour, tested before the switch.
#               The old colour keeps running until the next promotion: switching back is instant.
#               Both colours share the data, so a schema change must work with the old version too.
strategy: in-place
blueGreen:
  live: blue
  previewHost: ""
  blue: {repository: "", tag: ""}
  green: {repository: "", tag: ""}

replicaCount: 1
containerPort: 3000

service:
  type: NodePort               # ClusterIP behind an ingress
  port: 80
  nodePort: 30080

ingress:
  enabled: false
  host: app.example.com
  className: nginx
  tls: false                   # serve TLS from the <name>-tls secret (e.g. made by cert-manager)
  annotations: {}

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

env: {}   # extra non-secret env vars (e.g. LOGGING: silent; the modules' defaults are in src/modules/config.ts)

# the first admin account (used when the app has local accounts); the password is generated into
# the <name>-admin Secret, never set here
admin:
  email: admin@example.com

# turn off when the app stores nothing (DATABASE_URL is then unset)
postgres:
  enabled: true
  image: postgres:16-alpine
  database: app
  user: app
  storage: 1Gi
