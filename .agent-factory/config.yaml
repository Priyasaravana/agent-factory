# Agent Factory configuration.
#
# Follows the BuilderIO/skills Factory convention (.agent-factory/config.yaml):
#   - every action has its OWN policy; permission for one never implies another
#   - missing or partial evidence is a HOLD, never a plausible success
#   - `skill_prompts` layer project guidance onto skills without forking them
# and extends it with the greenfield build line (stations) this factory adds.
#
# Never put credentials in this file. Secrets come from .env (see .env.example).

version: 1
timezone: Europe/London

factory:
  name: agent-factory
  max_concurrent_changes: 1       # a laptop works on one change at a time
  data_dir: /data                 # state db, product repos, run worktrees, holdout
  public_app_base_url: http://localhost   # apps are reachable at <base>:<host_port>

models:
  # Aliases resolve to the latest model of each tier (see docs/adr/0005).
  judgment: opus      # intake, design, acceptance: where reasoning quality matters
  default: sonnet     # implementation
  fast: haiku         # mechanical sub-agent work (efficient-frontier pattern)

# The factory default lanes (ADR-0039): one lane per kind of work, always available. A change runs
# the org workflow assigned to its product for its kind, else the default lane for (works_on, kind).
# Edits to a default become new versions; "Back to factory default" restores the shipped lane.
# Set `use_factory_defaults: true` to ignore every assignment (e.g. while an org workflow misbehaves).
workflows:
  new-product: workflow-templates/standard/lanes/new-product.yaml
  product-change: workflow-templates/standard/lanes/product-change.yaml
  repo-assessment: workflow-templates/standard/lanes/repo-assessment.yaml
  repo-change: workflow-templates/standard/lanes/repo-change.yaml
use_factory_defaults: false

# ---------------------------------------------------------------------------
# Packs (ADR-0039 §2, ADR-0041): reviewed folders an admin installs. A stack pack says WHAT to
# build: template, golden-path skill, verify command, technologies, port, chart and how its stack
# proves the readiness signals. Adding a stack means adding a pack folder, not engine code.
# ---------------------------------------------------------------------------
packs:
  - packs/fastapi-service
  # Next.js web apps (ADR-0041 step 3). Its toolchain asks for Chromium, so the agent sandbox image
  # gains a browser layer (~150 MB) for the Playwright and accessibility tests; remove this line
  # (and the nextjs-web blueprint) to keep the smaller image.
  - packs/nextjs-web

# Blueprints say WHERE and HOW this install runs a pack: environment, node ports, scan commands,
# minimum readiness level. A pack field set here as well overrides the pack's (recorded as evidence).
blueprints:
  fastapi-service:
    description: Python FastAPI REST service with Postgres, Helm chart, NodePort
    # template, verify command, port, chart and stack come from the pack. A request that requires
    # anything outside the pack's technologies (e.g. Node.js, Go, MongoDB, a React UI) is asked
    # about at intake instead of silently built in Python.
    pack: fastapi-service
    # Runs inside dind (the docker CLI talks to it), so nothing is installed in the
    # factory image. {image} is filled in by the Build station. Pin a digest
    # (aquasec/trivy@sha256:...) once you have verified one you trust.
    # The JSON report is judged by the engine (ADR-0042): critical CVEs block (`scan_fail_on`),
    # an app dependency goes back to the developer with the exact bump, a base-image or unfixed
    # CVE holds for a person; high CVEs are recorded in the product's work ledger.
    scan_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
      aquasec/trivy:latest image --quiet --format json --severity HIGH,CRITICAL {image}
    # Readiness station: the generated repo must stay at agent-readiness Level 3
    # (docs/practices.md). The secret scan runs in dind on the run worktree ({path}).
    min_readiness_level: 3
    secret_scan_command: >-
      docker run --rm -v {path}:{path}:ro zricethezav/gitleaks:v8.24.3
      detect --no-git --source {path} --redact --no-banner --exit-code 1
    # SPDX SBOM of every built image, next to a provenance record (artifacts/<run>/)
    sbom_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v {out}:{out}
      anchore/syft:latest {image} -o spdx-json={out}/sbom.spdx.json -q
    node_ports: 30080-30099       # mapped to host 8081-8100 (cluster/kind-config.yaml); archive products to free one
    environment: local            # where registry/scan/deploy/publish happen (see below)

  nextjs-web:
    description: Next.js web app with Postgres, Helm chart, NodePort
    # template, verify and e2e commands, port, health paths, chart and stack come from the pack
    pack: nextjs-web
    scan_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
      aquasec/trivy:latest image --quiet --format json --severity HIGH,CRITICAL {image}
    min_readiness_level: 3
    secret_scan_command: >-
      docker run --rm -v {path}:{path}:ro zricethezav/gitleaks:v8.24.3
      detect --no-git --source {path} --redact --no-banner --exit-code 1
    sbom_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v {out}:{out}
      anchore/syft:latest {image} -o spdx-json={out}/sbom.spdx.json -q
    node_ports: 30080-30099       # the same app ports as every blueprint: one pool, shared
    environment: local

  # Teams' existing repositories (ADR-0031): cloned read-only and assessed. Nothing is
  # built, deployed or pushed; the report and a proposed AGENTS.md are sealed evidence.
  existing-repo:
    description: An existing repository, assessed read-only (stack, readiness, findings, test gaps)
    target: repo
    # assessments run the repo-assessment lane; feature, bug and upkeep changes the repo-change
    # lane, tested, reviewed and opened as a pull request (ADR-0033, ADR-0039)
    # the same secret scan as built apps, over the cloned repo
    secret_scan_command: >-
      docker run --rm -v {path}:{path}:ro zricethezav/gitleaks:v8.24.3
      detect --no-git --source {path} --redact --no-banner --exit-code 1
    environment: local

existing_repos:
  allowed_hosts: [github.com]     # https URLs on these hosts only; private repos come later (token reference)
  # pull requests (ADR-0033): a fine-grained token with Contents + Pull requests read/write
  # on the repos, in .env. A reference, never the value.
  write_token_ref: env://REPO_GITHUB_TOKEN

# Scan stations (ADR-0035) are named after what they check: secrets, code, dependencies,
# config. Who answers each check is chosen here, once for the factory:
#   local  - open-source tool in dind (gitleaks, Semgrep, OSV-Scanner, Trivy): free, the default
#   github - the repo's GitHub code scanning / Dependabot / secret scanning alerts (repos only;
#            they describe the default branch, so they inform a pull request but never block it)
#   snyk   - Snyk Code / Open Source / IaC with your Snyk account (no secrets check)
#   agent  - the observe-only checker agent (lower confidence: capped at high, files verified)
# When the provider can't answer (no token, not a repo, the tool didn't run) the station
# falls back to the agent and says so; `fallback: none` holds the change instead.
checks:
  providers: {secrets: local, code: local, dependencies: local, config: local}
  fallback: agent
  snyk_token_ref: env://SNYK_TOKEN           # a Snyk API token, in .env
  github_token_ref: env://REPO_GITHUB_TOKEN  # + Code scanning, Dependabot and Secret scanning alerts: read

# ---------------------------------------------------------------------------
# Delivery integrations (docs/design/integrations.md). Stations call the
# provider bound to the blueprint's environment for each capability.
# `local` (kind + dind + Trivy + gh) always exists and needs no config.
# Never put credentials here: `auth.secret_ref` names where one lives.
# ---------------------------------------------------------------------------
integrations:
  local:
    provider: local
    auth:
      # a reference, never a value: env:// (dev, from .env), file:// (mounted secret),
      # aws-sm://id#key (AWS Secrets Manager), vault://mount/path#key (Vault KV v2)
      secret_ref: env://GITHUB_TOKEN   # used by publish
  # Phase 5 (ADR-0026): any OCI registry + Helm to any cluster, one ingress host per app
  # (no port limit). These two are the local trial on the kind cluster: run
  # `make reset-cluster` once (new port and registry settings), then `make local-ingress`,
  # then set a blueprint's `environment: local-ingress`. For a real cluster copy them,
  # e.g. repository ghcr.io/<owner>/factory with username + secret_ref, and
  # ingress_domain apps.example.com with public_scheme https and a kubeconfig secret_ref.
  kind-registry:
    provider: oci
    settings: {repository: "localhost:5001/factory", insecure: true, check_host: "dind:5001"}
  kind-ingress:
    provider: helm
    settings:
      ingress_domain: localtest.me     # *.localtest.me resolves to 127.0.0.1 (your Mac)
      public_scheme: http
      public_port: 8180                # compose maps it to the kind ingress
      connect_via: "dind:8180"         # how the engine reaches the ingress from its container
environments:
  local: {registry: local, scan: local, deploy: local, publish: local}
  local-ingress: {registry: kind-registry, scan: local, deploy: kind-ingress, publish: local}

# ---------------------------------------------------------------------------
# Model gateway (docs/adr/0036-model-gateway.md). direct = agents call the model
# provider themselves (default). litellm = agents call the gateway with a virtual key
# minted per agent call: capped, short-lived, revoked when the call ends, metered.
# Turn on with COMPOSE_PROFILES=gateway and LITELLM_MASTER_KEY in .env.
# ---------------------------------------------------------------------------
model_gateway:
  provider: direct                # direct | litellm
  # url: http://model-gateway:4000
  # credential: api_key           # api_key: provider key only in the gateway (anything others run)
  #                               # subscription: your Claude login forwarded per request (own use)
  # call_budget_usd: 5            # hard cap per agent call, enforced by the gateway
  # change_budget_usd: 30         # no new agent calls in a change past this
  # key_minutes: 180              # a virtual key's lifetime if it is never revoked

# ---------------------------------------------------------------------------
# Agent sandbox (docs/adr/0014-agent-sandbox.md). Every agent session and every
# run of agent-written code (verify) gets a throw-away container inside dind:
# only the run worktree is writable, no factory secrets, no Docker, no cluster,
# and the network's only exit is this egress allowlist. Check it with
# `make sandbox-check`.
# ---------------------------------------------------------------------------
sandbox:
  mode: container                 # container | off (development only)
  memory: 4g
  cpus: "2"
  egress:                         # host:port, *.domain:port or host:lo-hi
    - api.anthropic.com:443       # the model
    - pypi.org:443                # Python packages
    - files.pythonhosted.org:443
    - registry.npmjs.org:443      # Node packages (existing repos' own checks, ADR-0033)
    - dind:8081-8100              # apps on the local cluster (acceptance)
    - "*.localtest.me:8180"       # apps behind the local ingress (kind-ingress)
  routes:                         # keep the host name, connect elsewhere (sandbox/egress.py)
    - "*.localtest.me:8180=dind:8180"

# Readiness checks + preflight (docs/adr/0015-readiness-and-preflight.md):
# a failed check refuses new products/changes before any model usage.
preflight:
  interval_minutes: 15
  max_age_seconds: 60
  docker_disk_warn_percent: 85    # warn (never block) above this; `make clean-docker` frees space

# Trust and change risk (docs/adr/0027-change-risk-policy.md). The shipped
# acceptable-use rules always apply; rules here only add to them.
change_risk:
  break_glass: true               # single-admin install: the requester may approve their own risky change…
  cooling_off_minutes: 60         # …after this delay, flagged as break-glass in the evidence
  allowed_hosts: []               # outside hosts apps may call without a hold, e.g. "api.stripe.com", "*.partner.io"
  acceptable_use: []              # e.g. {id: no-gambling, title: gambling apps, pattern: "\\b(casino|betting)\\b"}

# ---------------------------------------------------------------------------
# Action policies (Builder Factory style). Modes: auto | manual | off
# ---------------------------------------------------------------------------
policies:
  implement:
    mode: auto
    stop: [security-sensitive auth changes, destructive data migrations]
  deploy:
    mode: auto
    targets: [kind-local]         # production deploy is never implied
  publish:                        # push product repos to GitHub
    mode: auto
    provider: github
    visibility: private
    owner: ""                     # empty = the authenticated user
  merge:                          # fast-forward run branch into main
    mode: auto
    require: [all stations passed, acceptance passed]
  recover:
    mode: manual                  # interrupted runs are resumed from the UI only

# Human gates. You chose: requirements in, feedback after deploy.
gates:
  - id: feedback
    after: deliver
    kind: feedback                # a feedback submission starts the next iteration

budgets:
  max_attempts_per_station: 3     # then HOLD for a human
  max_loops_per_change: 6         # total fail->retry transitions per change
  change_wall_clock_minutes: 120  # agent time per run: host sleep and waiting for people don't count
  # failure classes (ADR-0043): an infra failure (expired key, model API down, cluster unreachable)
  # is retried in place, never sent to the developer, and not counted above
  infra_retries: 3
  infra_backoff_seconds: [20, 90, 300]  # full jitter under each step; the last repeats
  agent_call_minutes: 45     # one agent call, in agent time; past it the change is held
  agent_stall_minutes: 15    # a call that sends nothing this long is cancelled and retried
                             # (above Claude Code's 10-minute ceiling for one Bash tool call)

limits:
  # stay-within-limits, enforced natively by the engine from the SDK's
  # rate-limit events: pause new agent work at this utilisation.
  pause_at_utilization: 0.95

# Per-skill project guidance, layered onto the skill wherever an agent uses it.
# Installed on first start (from the copy baked into the image, else GitHub) and
# then managed on the Skills page. Changing a pin here only affects new installs.
default_skills:
  - repo: BuilderIO/skills
    ref: main
    sha: a74a3a0b8f400d2820351bcd695a7217dc88bec7
    license: MIT
    paths:
      - skills/plow-ahead
      - skills/agent-watchdog
      - skills/efficient-frontier
      - skills/read-the-damn-docs
      - skills/quick-recap
      - skills/stay-within-limits
      - skills/factory-recover

# token for importing templates/skills from private GitHub repos (a reference)
skills_github_token_ref: env://SKILLS_GITHUB_TOKEN

skill_prompts:
  # Engineering standards skills (ADR-0032): apply them in proportion to the request.
  well-architected-standards: |
    In the factory, apply the pillars in proportion to the product and the request.
    The platform is the blueprint's (a container and Helm on Kubernetes): don't add
    cloud services the request doesn't ask for; name them as recommendations instead.
    The Design station records the Pillar check in docs/design.md; other stations
    report through the station contract and never add the table to their output.
    A pillar gap the request doesn't cover is a note or a minor finding, never a blocker.
  devsecops-practices: |
    In the factory, CI, scans, SBOM and provenance already run in the Test, Quality gate,
    Change risk and Build stations. Do the code-level practices (tests with the code, no
    secrets, pinned dependencies, structured logs, health probes) and don't add pipeline
    tooling the request doesn't ask for.
  plow-ahead: |
    Humans only give requirements and post-deploy feedback. Turn routine
    ambiguity into recorded assumptions (log_decision) and keep going.
  agent-watchdog: |
    You are the Acceptance station. Form your own view of each holdout
    scenario from the live app before reading any builder claims.
