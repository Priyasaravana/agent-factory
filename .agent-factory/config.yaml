# Agent Factory configuration.
#
# Follows the BuilderIO/skills Factory convention (.agent-factory/config.yaml):
#   - every action has its OWN policy; permission for one never implies another
#   - missing or partial evidence is a HOLD, never a plausible success
#   - `skill_prompts` layer project guidance onto skills without forking them
# and extends it with the greenfield build line (stations) this factory adds.
#
# Never put credentials in this file. Secrets come from .env (see .env.example).

version: 1
timezone: Europe/London

factory:
  name: agent-factory
  max_concurrent_runs: 1          # a laptop runs one line at a time
  data_dir: /data                 # state db, product repos, run worktrees, holdout
  public_app_base_url: http://localhost   # apps are reachable at <base>:<host_port>

models:
  # Aliases resolve to the latest model of each tier (see docs/adr/0005).
  judgment: opus      # intake, design, acceptance: where reasoning quality matters
  default: sonnet     # implementation
  fast: haiku         # mechanical sub-agent work (efficient-frontier pattern)

# ---------------------------------------------------------------------------
# Product lines = golden paths. Adding an app type means adding a template
# folder and an entry here, not writing engine code.
# ---------------------------------------------------------------------------
product_lines:
  fastapi-service:
    description: Python FastAPI REST service with Postgres, Helm chart, NodePort
    template: templates/fastapi-service
    verify_command: make verify
    # Runs inside dind (the docker CLI talks to it), so nothing is installed in the
    # factory image. {image} is filled in by the Package station. Pin a digest
    # (aquasec/trivy@sha256:...) once you have verified one you trust.
    scan_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
      aquasec/trivy:latest image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed {image}
    chart_path: deploy/chart
    service_port: 8000
    node_ports: [30080, 30081, 30082, 30083, 30084]   # mapped to host 8081-8085

# ---------------------------------------------------------------------------
# Action policies (Builder Factory style). Modes: auto | manual | off
# ---------------------------------------------------------------------------
policies:
  implement:
    mode: auto
    stop: [security-sensitive auth changes, destructive data migrations]
  deploy:
    mode: auto
    targets: [kind-local]         # production deploy is never implied
  publish:                        # push product repos to GitHub
    mode: auto
    provider: github
    visibility: private
    owner: ""                     # empty = the authenticated user
  merge:                          # fast-forward run branch into main
    mode: auto
    require: [all stations passed, acceptance passed]
  recover:
    mode: manual                  # interrupted runs are resumed from the UI only

# Human gates. You chose: requirements in, feedback after deploy.
gates:
  - id: feedback
    after: deliver
    kind: feedback                # a feedback submission starts the next iteration

# ---------------------------------------------------------------------------
# The line. kind: agent | check (deterministic). on_fail routes to a station.
# ---------------------------------------------------------------------------
stations:
  - id: intake
    kind: agent
    role: intake
    model: judgment
  - id: design
    kind: agent
    role: architect
    model: judgment
  - id: build
    kind: agent
    role: developer
    model: default
  - id: verify
    kind: check
    on_fail: build
  - id: package
    kind: check
    on_fail: build
  - id: deploy
    kind: check
    on_fail: deploy_fix
  - id: deploy_fix
    kind: agent
    role: devops
    model: default
    next: deploy                  # repair station: loops back, not forward
    only_on_fail: true
  - id: acceptance
    kind: agent
    role: verifier
    model: judgment
    on_fail: build
  - id: deliver
    kind: check

budgets:
  max_attempts_per_station: 3     # then HOLD for a human
  max_loops_per_run: 6            # total fail->retry transitions per run
  agent_max_turns:
    intake: 30
    architect: 40
    developer: 120
    devops: 40
    verifier: 60
  run_wall_clock_minutes: 120

limits:
  # stay-within-limits, enforced natively by the engine from the SDK's
  # rate-limit events: pause new agent work at this utilisation.
  pause_at_utilization: 0.95

# Skills available to each role (loaded from plugin/ as agent-factory:<name>).
role_skills:
  intake: [plow-ahead, read-the-damn-docs, factory-station-contract]
  architect: [read-the-damn-docs, factory-station-contract, fastapi-golden-path]
  developer: [plow-ahead, efficient-frontier, read-the-damn-docs, factory-station-contract, fastapi-golden-path]
  devops: [read-the-damn-docs, factory-station-contract, helm-kind-deploy]
  verifier: [agent-watchdog, factory-station-contract]

skill_prompts:
  plow-ahead: |
    Humans only give requirements and post-deploy feedback. Turn routine
    ambiguity into recorded assumptions (log_decision) and keep going.
  agent-watchdog: |
    You are the Acceptance station. Form your own view of each holdout
    scenario from the live app before reading any builder claims.
