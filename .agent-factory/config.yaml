# Agent Factory configuration.
#
# Follows the BuilderIO/skills Factory convention (.agent-factory/config.yaml):
#   - every action has its OWN policy; permission for one never implies another
#   - missing or partial evidence is a HOLD, never a plausible success
#   - `skill_prompts` layer project guidance onto skills without forking them
# and extends it with the greenfield build line (stations) this factory adds.
#
# Never put credentials in this file. Secrets come from .env (see .env.example).

version: 1
timezone: Europe/London

factory:
  name: agent-factory
  max_concurrent_runs: 1          # a laptop runs one line at a time
  data_dir: /data                 # state db, product repos, run worktrees, holdout
  public_app_base_url: http://localhost   # apps are reachable at <base>:<host_port>

models:
  # Aliases resolve to the latest model of each tier (see docs/adr/0005).
  judgment: opus      # intake, design, acceptance: where reasoning quality matters
  default: sonnet     # implementation
  fast: haiku         # mechanical sub-agent work (efficient-frontier pattern)

# ---------------------------------------------------------------------------
# Product lines = golden paths. Adding an app type means adding a template
# folder and an entry here, not writing engine code.
# ---------------------------------------------------------------------------
product_lines:
  fastapi-service:
    description: Python FastAPI REST service with Postgres, Helm chart, NodePort
    template: templates/fastapi-service
    # The product line's workflow (stations + agents) is seeded from this template
    # on first start, then edited in the UI and stored as versions in the DB.
    workflow_template: workflow-templates/default
    verify_command: make verify
    # What this product line builds with. An order that requires anything else (e.g. Node.js,
    # Go, MongoDB, a React UI) is asked about at intake instead of silently built in Python.
    stack: [python, fastapi, postgres, sqlalchemy, docker, helm, kubernetes]
    # Runs inside dind (the docker CLI talks to it), so nothing is installed in the
    # factory image. {image} is filled in by the Package station. Pin a digest
    # (aquasec/trivy@sha256:...) once you have verified one you trust.
    scan_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
      aquasec/trivy:latest image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed {image}
    # Readiness station: the generated repo must stay at agent-readiness Level 3
    # (docs/practices.md). The secret scan runs in dind on the run worktree ({path}).
    min_readiness_level: 3
    secret_scan_command: >-
      docker run --rm -v {path}:{path}:ro zricethezav/gitleaks:v8.24.3
      detect --no-git --source {path} --redact --no-banner --exit-code 1
    # SPDX SBOM of every built image, next to a provenance record (artifacts/<run>/)
    sbom_command: >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v {out}:{out}
      anchore/syft:latest {image} -o spdx-json={out}/sbom.spdx.json -q
    chart_path: deploy/chart
    service_port: 8000
    node_ports: 30080-30099       # mapped to host 8081-8100 (cluster/kind-config.yaml); archive orders to free one
    environment: local            # where registry/scan/deploy/publish happen (see below)

# ---------------------------------------------------------------------------
# Delivery integrations (docs/design/integrations.md). Stations call the
# provider bound to the product line's environment for each capability.
# `local` (kind + dind + Trivy + gh) always exists and needs no config.
# Never put credentials here: `auth.secret_ref` names where one lives.
# ---------------------------------------------------------------------------
integrations:
  local:
    provider: local
    auth:
      # a reference, never a value: env:// (dev, from .env), file:// (mounted secret),
      # aws-sm://id#key (AWS Secrets Manager), vault://mount/path#key (Vault KV v2)
      secret_ref: env://GITHUB_TOKEN   # used by publish
  # Phase 5 (ADR-0026): any OCI registry + Helm to any cluster, one ingress host per app
  # (no port limit). These two are the local trial on the kind cluster: run
  # `make reset-cluster` once (new port and registry settings), then `make local-ingress`,
  # then set a product line's `environment: local-ingress`. For a real cluster copy them,
  # e.g. repository ghcr.io/<owner>/factory with username + secret_ref, and
  # ingress_domain apps.example.com with public_scheme https and a kubeconfig secret_ref.
  kind-registry:
    provider: oci
    settings: {repository: "localhost:5001/factory", insecure: true, check_host: "dind:5001"}
  kind-ingress:
    provider: helm
    settings:
      ingress_domain: localtest.me     # *.localtest.me resolves to 127.0.0.1 (your Mac)
      public_scheme: http
      public_port: 8180                # compose maps it to the kind ingress
      connect_via: "dind:8180"         # how the engine reaches the ingress from its container
environments:
  local: {registry: local, scan: local, deploy: local, publish: local}
  local-ingress: {registry: kind-registry, scan: local, deploy: kind-ingress, publish: local}

# ---------------------------------------------------------------------------
# Agent sandbox (docs/adr/0014-agent-sandbox.md). Every agent session and every
# run of agent-written code (verify) gets a throw-away container inside dind:
# only the run worktree is writable, no factory secrets, no Docker, no cluster,
# and the network's only exit is this egress allowlist. Check it with
# `make sandbox-check`.
# ---------------------------------------------------------------------------
sandbox:
  mode: container                 # container | off (development only)
  memory: 4g
  cpus: "2"
  egress:                         # host:port, *.domain:port or host:lo-hi
    - api.anthropic.com:443       # the model
    - pypi.org:443                # Python packages
    - files.pythonhosted.org:443
    - dind:8081-8100              # apps on the local cluster (acceptance)
    - "*.localtest.me:8180"       # apps behind the local ingress (kind-ingress)
  routes:                         # keep the host name, connect elsewhere (sandbox/egress.py)
    - "*.localtest.me:8180=dind:8180"

# Readiness checks + order preflight (docs/adr/0015-readiness-and-preflight.md):
# a failed check refuses new orders/iterations before any model usage.
preflight:
  interval_minutes: 15
  max_age_seconds: 60

# Trust and change risk (docs/adr/0027-change-risk-policy.md). The shipped
# acceptable-use rules always apply; rules here only add to them.
change_risk:
  break_glass: true               # single-admin install: the requester may approve their own risky change…
  cooling_off_minutes: 60         # …after this delay, flagged as break-glass in the evidence
  allowed_hosts: []               # outside hosts apps may call without a hold, e.g. "api.stripe.com", "*.partner.io"
  acceptable_use: []              # e.g. {id: no-gambling, title: gambling apps, pattern: "\\b(casino|betting)\\b"}

# ---------------------------------------------------------------------------
# Action policies (Builder Factory style). Modes: auto | manual | off
# ---------------------------------------------------------------------------
policies:
  implement:
    mode: auto
    stop: [security-sensitive auth changes, destructive data migrations]
  deploy:
    mode: auto
    targets: [kind-local]         # production deploy is never implied
  publish:                        # push product repos to GitHub
    mode: auto
    provider: github
    visibility: private
    owner: ""                     # empty = the authenticated user
  merge:                          # fast-forward run branch into main
    mode: auto
    require: [all stations passed, acceptance passed]
  recover:
    mode: manual                  # interrupted runs are resumed from the UI only

# Human gates. You chose: requirements in, feedback after deploy.
gates:
  - id: feedback
    after: deliver
    kind: feedback                # a feedback submission starts the next iteration

budgets:
  max_attempts_per_station: 3     # then HOLD for a human
  max_loops_per_run: 6            # total fail->retry transitions per run
  run_wall_clock_minutes: 120

limits:
  # stay-within-limits, enforced natively by the engine from the SDK's
  # rate-limit events: pause new agent work at this utilisation.
  pause_at_utilization: 0.95

# Per-skill project guidance, layered onto the skill wherever an agent uses it.
# Installed on first start (from the copy baked into the image, else GitHub) and
# then managed on the Skills page. Changing a pin here only affects new installs.
default_skills:
  - repo: BuilderIO/skills
    ref: main
    sha: a74a3a0b8f400d2820351bcd695a7217dc88bec7
    license: MIT
    paths:
      - skills/plow-ahead
      - skills/agent-watchdog
      - skills/efficient-frontier
      - skills/read-the-damn-docs
      - skills/quick-recap
      - skills/stay-within-limits
      - skills/factory-recover

# token for importing templates/skills from private GitHub repos (a reference)
skills_github_token_ref: env://SKILLS_GITHUB_TOKEN

skill_prompts:
  plow-ahead: |
    Humans only give requirements and post-deploy feedback. Turn routine
    ambiguity into recorded assumptions (log_decision) and keep going.
  agent-watchdog: |
    You are the Acceptance station. Form your own view of each holdout
    scenario from the live app before reading any builder claims.
