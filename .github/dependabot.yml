# Keep the factory's own dependencies current (OpenSSF Scorecard: Dependency-Update-Tool).
version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: {interval: weekly}
  - package-ecosystem: uv
    directory: /auth
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web: {patterns: ["*"]}
    ignore:
      # openapi-typescript (which generates the API types) supports TypeScript 5 only.
      # Lift this when it accepts the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  # Python base images: patch updates only. A Python minor upgrade (3.12 -> 3.13)
  # is a deliberate change across the images, CI and the golden-path template
  # together (engine/tests/test_python_versions.py enforces that they match).
  - package-ecosystem: docker
    directory: /images/factory
    schedule: {interval: weekly}
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /images/sandbox
    schedule: {interval: weekly}
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The sandbox's Node major is what stack packs ask for (`toolchain: [node@22]`,
      # sandbox/toolchain.py): a Node major is a deliberate change with the packs' templates.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /images/auth
    schedule: {interval: weekly}
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /web
    schedule: {interval: weekly}
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
