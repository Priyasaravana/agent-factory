name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # weekly: catches drift in base images and upstream packages
  workflow_dispatch:

# least privilege for every job (OpenSSF Scorecard: Token-Permissions)
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd engine && uv run --python 3.12 --extra dev ruff check src tests
      - run: cd engine && uv run --python 3.12 --extra dev pytest -q
      - name: OpenAPI contract is up to date
        run: |
          cd engine && uv run --python 3.12 agent-factory openapi --out /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: cd auth && uv run --python 3.12 --extra dev ruff check src tests
      - run: cd auth && uv run --python 3.12 --extra dev pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npm run gen:api && git diff --exit-code src/api/schema.d.ts && npm run build

  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: azure/setup-helm@v5
      - run: cd templates/fastapi-service && make verify
      - run: helm lint templates/fastapi-service/deploy/chart
      - run: helm template t templates/fastapi-service/deploy/chart > /dev/null

  # The next Python, ahead of time: advisory, so we know when an upgrade is safe.
  engine-next-python:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd engine && uv run --python ${{ matrix.python }} --extra dev pytest -q

  # What we ship, not just the source: every image builds, the engine's tests pass
  # on the Python inside the factory image, and the sandbox can verify the golden
  # path with the interpreter it pins (no downloads at run time).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: build the factory, auth and web images
        run: |
          docker build -f images/factory/Dockerfile -t af-factory:ci .
          docker build -f images/auth/Dockerfile -t af-auth:ci .
          docker build -t af-web:ci web
      - name: engine tests on the Python the factory image ships
        run: |
          # as the image's own user (uid 10001), on a copy: the checkout stays read-only
          docker run --rm --entrypoint "" -v "$PWD:/src:ro" \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv af-factory:ci sh -c '
              cp -r /src /tmp/src && cd /tmp/src/engine &&
              git config --global user.email ci@example.com && git config --global user.name ci &&
              git config --global --add safe.directory "*" &&
              uv run --python "$(command -v python3)" --extra dev pytest -q'
      - name: images run as non-root users (ADR-0018)
        run: |
          for img in af-factory:ci af-auth:ci af-web:ci; do
            uid=$(docker run --rm --entrypoint id "$img" -u)
            echo "$img runs as uid $uid"
            test "$uid" != 0
          done
          test "$(docker run --rm --entrypoint id af-factory:ci -u)" = 10001
      - name: build the sandbox image
        run: |
          cd engine && FACTORY_HOME=.. uv run --python 3.12 agent-factory sandbox context --out /tmp/sandbox-ctx
          docker build -t af-sandbox:ci /tmp/sandbox-ctx
          docker run --rm af-sandbox:ci sh -c 'claude --version && uv python list --only-installed'
      - name: the sandbox verifies the golden path as the sandbox user, without interpreter downloads
        run: |
          work=$(mktemp -d) && cp -r templates/fastapi-service/. "$work" && chmod -R a+rwX "$work"
          docker run --rm --user 10001:10001 --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /home/agent:rw,exec,uid=10001,gid=10001 \
            -e HOME=/home/agent -e UV_PYTHON_DOWNLOADS=never \
            -v "$work:/work" -w /work af-sandbox:ci make verify

  # The whole stack, as a user sees it, in dry-run (no model usage, so free):
  # compose up, sandbox isolation from inside a real sandbox, then a browser
  # walks sign-in → readiness → order → delivered → feedback → archive.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FACTORY_ADMIN_PASSWORD: ci-smoke-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: configure dry-run
        run: cp .env.example .env && sed -i 's/^FACTORY_MODE=.*/FACTORY_MODE=dry-run/' .env
      - name: start the stack
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: sandbox isolation (make sandbox-check)
        run: docker compose exec -T -u factory factory agent-factory sandbox check
      - name: least privilege (make privilege-check)
        run: scripts/privilege-check.sh
      - name: browser smoke test
        run: |
          uv run --python 3.12 --with playwright python -m playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 SMOKE_SCREENSHOTS=smoke-screenshots \
            uv run --python 3.12 --with playwright python web/e2e/smoke.py
      - name: server errors (tracebacks from the stack's logs)
        if: failure()
        run: |
          docker compose logs --no-color factory auth web 2>&1 \
            | grep -E -B3 -A40 "Traceback|\" 5[0-9][0-9] |level=error" | tail -250 || echo "no server errors logged"
      - name: collect logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            compose.log
            smoke-screenshots/
          retention-days: 14
