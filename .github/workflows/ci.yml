name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # weekly: catches drift in base images and upstream packages
  workflow_dispatch:

# least privilege for every job (OpenSSF Scorecard: Token-Permissions)
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd engine && uv run --python 3.12 --extra dev ruff check src tests
      - run: cd engine && uv run --python 3.12 --extra dev pytest -q
      - name: OpenAPI contract is up to date
        run: |
          cd engine && uv run --python 3.12 agent-factory openapi --out /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd auth && uv run --python 3.12 --extra dev ruff check src tests
      - run: cd auth && uv run --python 3.12 --extra dev pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npm run gen:api && git diff --exit-code src/api/schema.d.ts && npm run build

  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm's download cache: a dropped registry connection (ECONNRESET) no longer fails the job
          cache: npm
          cache-dependency-path: packs/nextjs-web/template/package-lock.json
      - run: cd packs/fastapi-service/template && make verify
      - run: helm lint packs/fastapi-service/template/deploy/chart
      - run: helm template t packs/fastapi-service/template/deploy/chart > /dev/null
      # stack pack #2 (ADR-0041): the Next.js template meets its own bar, and its chart renders
      - run: cd packs/nextjs-web/template && make verify
      - run: helm lint packs/nextjs-web/template/deploy/chart
      - run: |
          helm template t packs/nextjs-web/template/deploy/chart > /tmp/web.yaml
          grep -q 'path: /api/healthz' /tmp/web.yaml
          # the first admin (ADR-0044 §3): a generated password in its own Secret, read from it
          grep -q 'name: t-admin' /tmp/web.yaml
          grep -q 'key: password' /tmp/web.yaml
          ! grep -qi 'admin_password: ' packs/nextjs-web/template/deploy/chart/values.yaml
      # the cluster target (helm provider, ADR-0026): ClusterIP + an Ingress with TLS and a pull secret
      - run: |
          helm template t packs/fastapi-service/template/deploy/chart --set service.type=ClusterIP \
            --set ingress.enabled=true --set ingress.host=t.apps.example.com --set ingress.tls=true \
            --set 'imagePullSecrets[0].name=factory-pull' > /tmp/ingress.yaml
          grep -q '^kind: Ingress' /tmp/ingress.yaml
          grep -q 'secretName: t-tls' /tmp/ingress.yaml
          grep -q 'name: factory-pull' /tmp/ingress.yaml
          ! grep -q 'nodePort:' /tmp/ingress.yaml

  # The stack packs' charts in every deploy strategy (ADR-0046 slice 4), rendered by real Helm: blue
  # keeps the Deployment the app always had, the colours never select each other's pods, users reach
  # only the live colour and the preview only the idle one, bad values fail. Required on main.
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: azure/setup-helm@v5
      - run: helm version --short
      - run: cd engine && uv run --python 3.12 python ../scripts/check-charts.py

  # The next Python, ahead of time: advisory, so we know when an upgrade is safe.
  engine-next-python:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd engine && uv run --python ${{ matrix.python }} --extra dev pytest -q

  # What we ship, not just the source: every image builds, the engine's tests pass
  # on the Python inside the factory image, and the sandbox can verify the golden
  # path with the interpreter it pins (no downloads at run time).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: build the factory, auth and web images
        run: |
          docker build -f images/factory/Dockerfile -t af-factory:ci .
          docker build -f images/auth/Dockerfile -t af-auth:ci .
          docker build -t af-web:ci web
      - name: engine tests on the Python the factory image ships
        run: |
          # as the image's own user (uid 10001), on a copy: the checkout stays read-only
          docker run --rm --entrypoint "" -v "$PWD:/src:ro" \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv af-factory:ci sh -c '
              cp -r /src /tmp/src && cd /tmp/src/engine &&
              git config --global user.email ci@example.com && git config --global user.name ci &&
              git config --global --add safe.directory "*" &&
              uv run --python "$(command -v python3)" --extra dev pytest -q'
      - name: images run as non-root users (ADR-0018)
        run: |
          for img in af-factory:ci af-auth:ci af-web:ci; do
            uid=$(docker run --rm --entrypoint id "$img" -u)
            echo "$img runs as uid $uid"
            test "$uid" != 0
          done
          test "$(docker run --rm --entrypoint id af-factory:ci -u)" = 10001
      - name: build the sandbox image
        run: |
          cd engine && FACTORY_HOME=.. uv run --python 3.12 agent-factory sandbox context --out /tmp/sandbox-ctx
          # with the layers the installed packs ask for (Chromium for nextjs-web), as the engine builds it
          docker build $(cat /tmp/sandbox-ctx/build-args) -t af-sandbox:ci /tmp/sandbox-ctx
          docker run --rm af-sandbox:ci sh -c 'claude --version && uv python list --only-installed'
      - name: the sandbox verifies the golden path as the sandbox user, without interpreter downloads
        run: |
          work=$(mktemp -d) && cp -r packs/fastapi-service/template/. "$work" && chmod -R a+rwX "$work"
          docker run --rm --user 10001:10001 --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /home/agent:rw,exec,uid=10001,gid=10001 \
            -e HOME=/home/agent -e UV_PYTHON_DOWNLOADS=never \
            -v "$work:/work" -w /work af-sandbox:ci make verify
      # Every approved runtime image (ADR-0045) builds, runs as uid 65532 and answers its health
      # check: the Build station may fall back to any of them. af-nextjs-template:ci is the default.
      - name: the Next.js template's images build, run as non-root and answer their health check
        run: |
          for runtime in runtime-hardened runtime-distroless; do
            tag=af-nextjs-template:ci-$runtime
            docker build --build-arg RUNTIME=$runtime -t $tag packs/nextjs-web/template
            user=$(docker image inspect -f '{{.Config.User}}' $tag)
            echo "$runtime runs as '$user'"
            case "$user" in 65532|65532:65532) ;; *) echo "expected uid 65532 (the chart's runAsUser), got '$user'"; exit 1;; esac
            docker run -d --name nextjs-ci -p 3000:3000 $tag
            for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/healthz && break; sleep 1; done
            curl -fsS http://localhost:3000/api/healthz || { docker logs nextjs-ci; exit 1; }
            docker rm -f nextjs-ci
          done
          docker tag af-nextjs-template:ci-runtime-hardened af-nextjs-template:ci
      # The factory's Build station refuses an image with a fixable CRITICAL CVE. Advisory here: a new
      # upstream CVE should show up as a warning on the next PR, not block unrelated work. Trivy is the
      # factory's pinned version (.agent-factory/config.yaml; tests/test_scanner_pins.py).
      - name: the template images pass the factory's image scan (advisory)
        continue-on-error: true
        run: |
          docker build -t af-fastapi-template:ci packs/fastapi-service/template
          for img in af-nextjs-template:ci af-fastapi-template:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image \
              --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed "$img"
          done
      - name: the sandbox verifies the Next.js template and runs its e2e + accessibility tests with its Chromium
        run: |
          work=$(mktemp -d) && cp -r packs/nextjs-web/template/. "$work" && chmod -R a+rwX "$work"
          docker run --rm --user 10001:10001 --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /home/agent:rw,exec,uid=10001,gid=10001 \
            -e HOME=/home/agent -v "$work:/work" -w /work af-sandbox:ci sh -c '
              make verify &&
              cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/ &&
              (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js &) && sleep 3 &&
              make e2e BASE_URL=http://127.0.0.1:3000'

  # The whole stack, as a user sees it, in dry-run (no model usage, so free):
  # compose up, sandbox isolation from inside a real sandbox, then a browser
  # walks sign-in → readiness → order → delivered → feedback → archive.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FACTORY_ADMIN_PASSWORD: ci-smoke-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: configure dry-run
        run: cp .env.example .env && sed -i 's/^FACTORY_MODE=.*/FACTORY_MODE=dry-run/' .env
      - name: start the stack
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: sandbox isolation (make sandbox-check)
        run: docker compose exec -T -u factory factory agent-factory sandbox check
      - name: least privilege (make privilege-check)
        run: scripts/privilege-check.sh
      - name: browser smoke test
        run: |
          uv run --python 3.12 --with playwright python -m playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 SMOKE_SCREENSHOTS=smoke-screenshots \
            uv run --python 3.12 --with playwright python web/e2e/smoke.py
      - name: server errors (tracebacks from the stack's logs)
        if: failure()
        run: |
          docker compose logs --no-color factory auth web 2>&1 \
            | grep -E -B3 -A40 "Traceback|\" 5[0-9][0-9] |level=error" | tail -250 || echo "no server errors logged"
      - name: collect logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: |
            compose.log
            smoke-screenshots/
          retention-days: 14
