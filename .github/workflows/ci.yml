name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd engine && uv run --python 3.12 --extra dev ruff check src tests
      - run: cd engine && uv run --python 3.12 --extra dev pytest -q
      - name: OpenAPI contract is up to date
        run: |
          cd engine && uv run --python 3.12 agent-factory openapi --out /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npm run gen:api && git diff --exit-code src/api/schema.d.ts && npm run build

  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: azure/setup-helm@v4
      - run: cd templates/fastapi-service && make verify
      - run: helm lint templates/fastapi-service/deploy/chart
      - run: helm template t templates/fastapi-service/deploy/chart > /dev/null
