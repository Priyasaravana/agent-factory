name: security
# The factory's own security gates (assessment 2026-11-15, S-08): secrets in the whole history,
# known vulnerabilities in the locked dependencies, and static analysis. The image scans of the
# factory, auth, web and sandbox images are in ci.yml's `images` job, where the images are built.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"   # daily: a new advisory against an unchanged lockfile shows up within a day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}   # every commit, not only the tip: a secret removed later is still exposed
      - name: install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: no secret in any commit (allowed values in .gitleaks.toml)
        run: /tmp/gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner --exit-code 1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      # Exactly what the lockfiles pin, dev tools included (they run in CI with its token).
      - name: engine and auth have no known vulnerability (pip-audit)
        run: |
          for d in engine auth; do
            echo "== $d"
            (cd $d && uv export --frozen --all-extras --no-hashes --no-emit-project -q > /tmp/$d-req.txt)
            uvx --python 3.12 pip-audit==2.9.0 -r /tmp/$d-req.txt --disable-pip --no-deps --progress-spinner off --strict
          done
      # What ships in the UI bundle; build tools don't reach a browser.
      - name: the web UI's runtime packages have no high or critical advisory (npm audit)
        run: cd web && npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with: {category: "/language:${{ matrix.language }}"}
