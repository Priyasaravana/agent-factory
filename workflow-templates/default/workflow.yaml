# Default workflow for the FastAPI service blueprint.
# Stations run top to bottom, grouped by DevOps phase (ADR-0028):
#   plan: requirements, design · code: implement · test: test, quality-gate, code-review, change-risk
#   release: build · deploy: deploy (+ deploy-repair) · validate: acceptance · handover
# kind: agent (judgment work by an agent spec) or check (deterministic, engine-implemented).
# on_fail routes failure evidence; repair stations (only_on_fail) are reached only
# through on_fail and go to `next`. A custom station may set `phase:`.
name: default
description: Plan → code → test → release → deploy → validate → handover
# Spec review gate (ADR-0017): pause after design until a person approves the spec.
#   off (default) · first: the first change to a product · always: every iteration
spec_review: "off"
# Evaluation gate (ADR-0025): a published version is measured on evals.yaml first.
#   block: it stays a candidate until it shows no regression against the active
#          version, then activates · warn: activate now, evaluate and report · off
# Each evaluation builds every case (and the active version's, if never measured).
eval_gate: block
stations:
  - {id: requirements,  kind: agent, agent: intake}
  - {id: design,        kind: agent, agent: architect}
  - {id: implement,     kind: agent, agent: developer}
  - {id: test,          kind: check, on_fail: implement}
  - {id: quality-gate,  kind: check, on_fail: implement}   # agent-readiness Level 3 + secret scan
  - {id: code-review,   kind: agent, agent: reviewer, on_fail: implement}  # spec review of the change (ADR-0020)
  - {id: change-risk,   kind: check, on_fail: implement}  # rules over the diff; risky changes wait for a second admin (ADR-0027)
  - {id: build,         kind: check, on_fail: implement}
  - {id: deploy,        kind: check, on_fail: deploy-repair}
  - {id: deploy-repair, kind: agent, agent: devops, next: deploy, only_on_fail: true}
  - {id: acceptance,    kind: agent, agent: verifier, on_fail: implement}
  - {id: handover,      kind: check}
