# Default workflow for a FastAPI service product line.
# Stations run top to bottom. kind: agent (judgment work by an agent spec) or
# check (deterministic, engine-implemented). on_fail routes failure evidence;
# repair stations (only_on_fail) are reached only through on_fail and go to `next`.
name: default
description: Spec → design → build → verify → readiness → spec review → package → deploy → independent acceptance → deliver
# Spec review gate (ADR-0017): pause after design until a person approves the spec.
#   off (default) · first: the first iteration of an order · always: every iteration
spec_review: "off"
# Evaluation gate (ADR-0025): a published version is measured on evals.yaml first.
#   block: it stays a candidate until it shows no regression against the active
#          version, then activates · warn: activate now, evaluate and report · off
# Each evaluation builds every case (and the active version's, if never measured).
eval_gate: block
stations:
  - {id: intake,     kind: agent, agent: intake}
  - {id: design,     kind: agent, agent: architect}
  - {id: build,      kind: agent, agent: developer}
  - {id: verify,     kind: check, on_fail: build}
  - {id: readiness,  kind: check, on_fail: build}   # agent-readiness Level 3 + secret scan
  - {id: review,     kind: agent, agent: reviewer, on_fail: build}  # spec review of the change (ADR-0020)
  - {id: package,    kind: check, on_fail: build}
  - {id: deploy,     kind: check, on_fail: deploy_fix}
  - {id: deploy_fix, kind: agent, agent: devops, next: deploy, only_on_fail: true}
  - {id: acceptance, kind: agent, agent: verifier, on_fail: build}
  - {id: deliver,    kind: check}
