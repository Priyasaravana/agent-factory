# A change to an existing repository, delivered as a pull request (ADR-0033).
# The engine fetches the repo's branch before the first station; the change is made on a
# branch of that clone and leaves only as a pull request. A person merges.
#   plan: onboard · code: implement · test: test, review, change-risk · handover: pull-request
name: repo-change
description: Feature, bug fix or upkeep on an existing repo, tested and reviewed, opened as a pull request
spec_review: "off"
eval_gate: "off"
stations:
  - {id: onboard,      kind: check}                                                  # commit and stack
  - {id: implement,    kind: agent, agent: repo-developer, handler: repo-implement}
  - {id: test,         kind: check, handler: repo-test, on_fail: implement}          # the repo's own checks, in the sandbox
  - {id: review,       kind: agent, agent: repo-reviewer, handler: repo-review, on_fail: implement}
  - {id: change-risk,  kind: check, on_fail: implement}                              # rules over the diff (ADR-0027)
  - {id: pull-request, kind: check}                                                  # push the branch, open the PR
