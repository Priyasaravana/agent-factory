# Windows over the standard lane (ADR-0037 §4). A change runs the window for its target and kind;
# a window without kinds is a preset (started from a phase, composable SDLC step 3).
# enter / leave: a column (its first / last station) or a station id.
# entry: the artifacts the run starts from; the engine provides `branch` (scaffolded worktree for a
# factory product, the read-only clone for a repo) and `request` from the product or change text.
windows:
  - {id: factory-new,    title: New product,              target: factory, kinds: [new],
     enter: design, leave: handover, entry: [request@1, branch@1]}
  - {id: factory-change, title: Feature, bug or upkeep,   target: factory, kinds: [feature, bug, upkeep],
     enter: design, leave: handover, entry: [request@1, branch@1]}
  - {id: repo-assess,    title: Assess,                   target: repo,    kinds: [assess],
     enter: discover, leave: report, entry: [branch@1]}
  - {id: repo-change,    title: Repo feature, bug or upkeep, target: repo, kinds: [feature, bug, upkeep],
     enter: discover, leave: handover, entry: [request@1, branch@1]}
  # presets
  - {id: design-only,    title: Design only,              target: factory, enter: design, leave: design,
     entry: [request@1]}
  - {id: verify-only,    title: Verify only,              target: repo,    enter: discover, leave: verify,
     entry: [branch@1]}
  - {id: delivery,       title: Delivery,                 target: factory, enter: deliver, leave: handover,
     entry: [branch@1, report.test@1, report.risk@1]}
