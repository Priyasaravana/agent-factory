# The factory standard (ADR-0037): one lane holding every station, in the container's columns
#   discover · design · plan · develop · verify · deliver · operate
# Each change runs a window over it (presets.yaml): where it enters and leaves, what it starts
# from. A station's type picks its handler by the change's target (factory | repo) and is skipped
# where the type has no implementation; `applies_when` narrows the rest. Every skipped station is
# recorded with its reason. Mandatory controls (test, a secret scan, change-risk after the last
# branch change, before any image, url or pr) are checked per window when the version is published.
# on_fail routes failure evidence; repair stations (only_on_fail) are reached only through on_fail
# and go to `next`.
name: standard
description: The factory standard — one lane, a window per change kind (ADR-0037)
# Spec review gate (ADR-0017): pause after design until a person approves the spec.
#   off (default) · first: the first change to a product · always: every iteration
spec_review: "off"
# Evaluation gate (ADR-0025): a published version is measured on evals.yaml first (new products only).
#   block: it stays a candidate until it shows no regression against the active
#          version, then activates · warn: activate now, evaluate and report · off
eval_gate: block
stations:
  # discover: what exists (repo targets)
  - {id: onboard,   type: onboard}                                       # commit, size, detected stack
  - {id: repo-scan, type: repo-scan, applies_when: {windows: [repo-assess]}}  # readiness for any stack, rules, secret scan
  - {id: assess,    type: assess, agent: assessor, applies_when: {windows: [repo-assess]}}  # the engine judges
  # design: what to build and how (factory products)
  - {id: requirements, type: requirements, agent: intake,    applies_when: {target: [factory]}}
  - {id: design,       type: design,       agent: architect, applies_when: {target: [factory]}}
  # develop
  - id: implement
    type: implement
    agent: developer
    target_agents: {repo: repo-developer}
    applies_when: {not_windows: [repo-assess, verify-only]}
  # verify: does it work, is it safe. Scans are named after their check; who answers each one
  # (open-source tool, GitHub, Snyk, or the checker agent) is set under `checks:` in the config.
  - {id: test,         type: test, on_fail: implement, applies_when: {not_windows: [repo-assess]}}
  - {id: quality-gate, type: quality-gate, on_fail: implement}          # agent-readiness Level 3 + secret scan
  - {id: secret-scan,  type: scan, check: secrets, fail_on: high, on_fail: implement, agent: checker,
     applies_when: {target: [repo], not_windows: [repo-assess]}}        # factory: the quality gate's scan
  # factory: only critical findings send the change back; a repo change: high, in changed files;
  # an assessment reports and never fails
  - {id: code-scan,       type: scan, check: code,         fail_on: critical, fail_on_by: {repo: high, repo-assess: none}, on_fail: implement, agent: checker}
  - {id: dependency-scan, type: scan, check: dependencies, fail_on: critical, fail_on_by: {repo: high, repo-assess: none}, on_fail: implement, agent: checker}
  - {id: config-scan,     type: scan, check: config,       fail_on: critical, fail_on_by: {repo: high, repo-assess: none}, on_fail: implement, agent: checker}
  - id: code-review     # spec review of the change (ADR-0020); the engine judges
    type: code-review
    agent: reviewer
    target_agents: {repo: repo-reviewer}
    on_fail: implement
    applies_when: {not_windows: [repo-assess, verify-only]}  # verify-only has no request to review against
  - {id: change-risk, type: change-risk, on_fail: implement, applies_when: {not_windows: [repo-assess]}}  # ADR-0027
  # deliver: let it out (build, deploy and acceptance only where the factory deploys)
  - {id: build,  type: build, on_fail: implement}
  - {id: deploy, type: deploy, on_fail: deploy-repair}
  - id: deploy-repair   # a branch change: re-enters verify (ADR-0037 §5)
    type: deploy-repair
    agent: devops
    next: test
    only_on_fail: true
    applies_when: {not_windows: [delivery]}
  - {id: acceptance, type: acceptance, agent: verifier, on_fail: implement, applies_when: {not_windows: [delivery]}}
  - {id: handover,   type: handover, applies_when: {not_windows: [repo-assess]}}  # factory: merge + tag; repo: PR
  - {id: report,     type: report, applies_when: {windows: [repo-assess]}}       # assessment + proposed AGENTS.md
