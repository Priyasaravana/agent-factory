# Assessment of an existing repository (ADR-0031). Read-only: nothing is built,
# deployed or pushed. The engine clones the repo before the first station.
#   plan: onboard · test: repo-scan, code-scan, dependency-scan, config-scan, assess · handover: report
name: assess
description: Onboard an existing repo read-only and report its readiness, findings and test gaps
spec_review: "off"
eval_gate: "off"
learn_from_runs: false
stations:
  - {id: onboard,   kind: check}                   # commit, size, detected stack
  - {id: repo-scan, kind: check}                   # readiness signals for any stack, rules, secret scan
  # scan stations (ADR-0035): named after the check; who answers each one (open-source tool,
  # GitHub, Snyk, or the checker agent) is set under `checks:` in the config.
  # An assessment reports, so they never fail.
  - {id: code-scan,       kind: check, handler: scan, check: code,         fail_on: none, agent: checker}
  - {id: dependency-scan, kind: check, handler: scan, check: dependencies, fail_on: none, agent: checker}
  - {id: config-scan,     kind: check, handler: scan, check: config,       fail_on: none, agent: checker}
  - {id: assess,    kind: agent, agent: assessor}  # test gaps, risks, recommendations; the engine judges
  - {id: report,    kind: check}                   # assessment.md + .json and a proposed AGENTS.md
