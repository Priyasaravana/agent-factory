# image.* and service.nodePort are set by the factory's Deploy station.
image:
  repository: app
  tag: dev
  pullPolicy: IfNotPresent     # images are side-loaded with `kind load`

replicaCount: 1
containerPort: 8000

service:
  type: NodePort
  port: 80
  nodePort: 30080

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

env: {}   # extra non-secret env vars

postgres:
  enabled: true
  image: postgres:16-alpine
  database: app
  user: app
  storage: 1Gi
