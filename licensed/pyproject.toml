# SPDX-License-Identifier: LicenseRef-AgentFactory-Commercial
[project]
name = "agent-factory-licensed"
version = "0.1.0"
description = "Agent Software Factory, licensed edition: SSO, audit export, customer KMS signing, compliance pack"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Only what the core already ships: the enterprise image installs this with --no-deps over the core.
dependencies = ["cryptography>=46"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "agent-factory"]

[project.entry-points."agent_factory.extensions"]
licensed = "agent_factory_licensed:extension"

[project.scripts]
agent-factory-licence = "agent_factory_licensed.licence:main"

[tool.uv.sources]
agent-factory = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory_licensed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
