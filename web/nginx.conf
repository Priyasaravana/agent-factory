# S-04 (assessment 2026-11-15): the factory UI and the apps it builds must be different sites.
# Apps are served on 127.0.0.1:<port>, the UI on localhost: opened on 127.0.0.1, the UI moves to
# localhost (same port), so its session cookie is never set on the apps' host.
map $http_host $ui_on_app_host {
  default 0;
  "~^127\.0\.0\.1(:\d+)?$" 1;
}
map $http_host $ui_port {
  default "";
  "~(?<p>:\d+)$" $p;
}
# A page on another site (a generated app, anything else) must not write to the API or the auth
# service with the visitor's session. Browsers send Origin on every such request: it must name
# the host the request was sent to. No Origin (the CLI, API tokens, curl) is not a browser page.
map "$http_origin|$http_host" $cross_origin {
  default 1;
  "~^\|" 0;
  "~^https?://([^|/]+)\|\1$" 0;
}
map "$request_method:$cross_origin" $cross_site_write {
  default 0;
  "~^(POST|PUT|PATCH|DELETE):1$" 1;
}

# Request limits (S-10, with S-13's per-address part): sign-in attempts and webhook deliveries per
# client address. Behind Docker's port mapping every browser on the host shares one address, so
# the bursts are generous: they stop a guessing loop, not a person signing in a few times.
limit_req_zone $binary_remote_addr zone=signin:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook:1m rate=120r/m;
limit_req_status 429;

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;   # nginx's default, stated: no request to the UI, API or auth needs more
  include /etc/nginx/security-headers.conf;

  # Resolve services at request time via Docker's DNS, so nginx starts (and the
  # UI loads) even while the factory or auth containers are still starting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $engine http://factory:8000;
  # The gateway proof (assessment 2026-11-15, S-01): `set $gateway_proof "...";`, written by
  # factory-init. Added to every request passed to the engine, which answers nothing without
  # it: identity headers from any other caller on the network count for nothing. nginx does
  # not start without the file.
  include /etc/nginx/gateway-proof/proof.conf;

  if ($ui_on_app_host) {
    return 308 $scheme://localhost$ui_port$request_uri;
  }
  set $auth http://auth:8001;

  # Auth gateway: sign-in, sessions, users, API tokens (its own container).
  location /auth/ {
    if ($cross_site_write) { return 403 '{"detail":"cross-site request refused"}'; }
    proxy_pass $auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Sign-in itself: the same pass-through, with a per-address limit on attempts.
  location = /auth/login {
    if ($cross_site_write) { return 403 '{"detail":"cross-site request refused"}'; }
    limit_req zone=signin burst=20 nodelay;
    proxy_pass $auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Asked before every API request: 200 + identity, 401/403 otherwise.
  location = /_auth_check {
    internal;
    proxy_pass $auth/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
  }

  # The repo host's webhook (J3): no sign-in, it proves itself by its HMAC signature, which the
  # engine checks. Exactly this path; anything an identity header claims is dropped.
  location = /api/hooks/github {
    limit_except POST { deny all; }
    limit_req zone=webhook burst=60 nodelay;
    client_max_body_size 1m;
    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Gateway-Proof $gateway_proof;
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Role "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
  }

  location /api/ {
    if ($cross_site_write) { return 403 '{"detail":"cross-site request refused"}'; }
    auth_request /_auth_check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_role $upstream_http_x_auth_role;
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;

    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # identity comes only from the gateway; anything the browser sent is overwritten
    proxy_set_header X-Gateway-Proof $gateway_proof;   # whatever the browser sent is overwritten
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Role $auth_role;
    proxy_set_header Authorization "";   # the engine never sees credentials
    proxy_set_header Cookie "";
    # server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location @unauthorized {
    default_type application/json;
    return 401 '{"detail":"sign in required"}';
  }
  location @forbidden {
    default_type application/json;
    return 403 '{"detail":"password change required"}';
  }

  # The page is revalidated on every load, so a rebuilt UI shows up without a hard
  # refresh. Built assets carry a content hash in their name and stay cacheable.
  # (The try_files fallback below lands here too, so SPA routes get the header.)
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }
}
