server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://factory:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
