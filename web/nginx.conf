server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the engine at request time via Docker's DNS, so nginx starts (and the
  # UI loads) even while the factory container is still starting or restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $engine http://factory:8000;

  location /api/ {
    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
