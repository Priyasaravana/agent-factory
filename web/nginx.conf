server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve services at request time via Docker's DNS, so nginx starts (and the
  # UI loads) even while the factory or auth containers are still starting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $engine http://factory:8000;
  set $auth http://auth:8001;

  # Auth gateway: sign-in, sessions, users, API tokens (its own container).
  location /auth/ {
    proxy_pass $auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Asked before every API request: 200 + identity, 401/403 otherwise.
  location = /_auth_check {
    internal;
    proxy_pass $auth/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
  }

  location /api/ {
    auth_request /_auth_check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_role $upstream_http_x_auth_role;
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;

    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # identity comes only from the gateway; anything the browser sent is overwritten
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Role $auth_role;
    proxy_set_header Authorization "";   # the engine never sees credentials
    proxy_set_header Cookie "";
    # server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location @unauthorized {
    default_type application/json;
    return 401 '{"detail":"sign in required"}';
  }
  location @forbidden {
    default_type application/json;
    return 403 '{"detail":"password change required"}';
  }

  location / {
    try_files $uri /index.html;
  }
}
