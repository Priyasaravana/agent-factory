# Security headers for every response from the gateway (assessment 2026-11-15, S-10).
# Included in the server block and again in any location that sets its own add_header, because
# nginx drops inherited add_header lines in a location that has one (tests/test_static_ops.py).
# `always`: error responses (401, 403, 429, 5xx) carry them too.
#
# CSP: the UI is a same-origin single-page app. No inline scripts (the theme script is
# /theme.js); inline styles are allowed because toast and popover libraries inject <style> at run
# time. Images allow data: (the favicon, small icons). Nothing may frame the UI.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
